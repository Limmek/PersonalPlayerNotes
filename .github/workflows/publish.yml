name: Publish

# Triggered when the Release workflow completes successfully.
# Using workflow_run instead of push:tags avoids a GitHub limitation:
# tags pushed by GITHUB_TOKEN do not trigger other workflows.
#
# GITHUB_EVENT_NAME is "workflow_run" (not "push"), so BigWigsMods/packager's
# branch-push skip check never fires and it packages normally.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  publish:
    name: Package and publish
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: write

    env:
      # BigWigsMods/packager v2.5.1 reads CF_API_KEY and GITHUB_OAUTH.
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Package and publish
        uses: BigWigsMods/packager@v2.5.1
        with:
          args: -p 344967 -w 0 -a 0 -m .pkgmeta
