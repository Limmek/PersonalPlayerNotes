name: Release

# Triggered by a push to the `release` branch.
# Computes the next patch version (1.1.1 -> 1.1.2), creates a git tag,
# and pushes it. The tag push then triggers publish.yml which runs
# BigWigsMods/packager to build, upload to CurseForge, and create the
# GitHub release.

on:
  push:
    branches:
      - release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Bump patch version and tag
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next patch version
        id: version
        run: |
          LATEST=$(git tag --sort=-version:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          if [ -z "$LATEST" ]; then
            NEXT="1.0.1"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "tag=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${NEXT}"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Package and publish
        uses: BigWigsMods/packager@v2.5.1
        with:
          args: -p 344967 -w 0 -a 0 -m .pkgmeta
