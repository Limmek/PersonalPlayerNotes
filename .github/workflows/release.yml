name: Release

# Branch model: `master` is the development branch; `release` is the
# release branch. Push any commit to `release` to automatically cut a
# new patch release (1.1.1 -> 1.1.2). The changelog.txt content is used
# as the release body.

on:
  workflow_dispatch:
  push:
    branches:
      - release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Bump patch version, package and publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      # BigWigsMods/packager v2.5.1 reads CF_API_KEY and GITHUB_OAUTH.
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next patch version
        id: version
        run: |
          LATEST=$(git tag --sort=-version:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          if [ -z "$LATEST" ]; then
            NEXT="1.0.1"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "tag=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${NEXT}"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Package and publish
        uses: BigWigsMods/packager@v2.5.1
        with:
          args: -p 344967 -w 0 -a 0 -m .pkgmeta
