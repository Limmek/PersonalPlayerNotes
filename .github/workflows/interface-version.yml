name: Update TOC Interface version(s)

on:
  workflow_dispatch:
  schedule:
    - cron: 0 12 * * *

jobs:
  run:
    name: TOCcheck
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v6
      
      - name: Checking Vanilla
        uses: p3lim/toc-interface-updater@v4
        with:
          flavor: vanilla

      - name: Checking Wrath
        uses: p3lim/toc-interface-updater@v4
        with:
          flavor: wrath

      - name: Checking Mists
        uses: p3lim/toc-interface-updater@v4
        with:
          flavor: mists

      - name: Checking Retail
        uses: p3lim/toc-interface-updater@v4
        with:
          flavor: retail

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'Update TOC interface version(s)'
          branch: 'ci/toc-interface-update'
          delete-branch: true
          title: 'Update TOC interface version(s)'
          body: 'Automated TOC interface version update.'
          labels: 'maintenance'
